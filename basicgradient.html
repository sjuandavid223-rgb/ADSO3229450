<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basic Conic Gradient</title>

    <link rel="stylesheet" href="basicgradient.css">

</head>

<body>

    <h1>Ejemplos de Basic Conic Gradient</h1>

    <div class="contenedor">

        <div class="caja">
            <h3>Básico</h3>
            <div class="gradiente basic"></div>
        </div>

        <div class="caja">
            <h3>Con Ángulo</h3>
            <div class="gradiente angle"></div>
        </div>

        <div class="caja">
            <h3>Desde el Centro</h3>
            <div class="gradiente center"></div>
        </div>

        <div class="caja">
            <h3>Tipo Pastel</h3>
            <div class="gradiente pie"></div>
        </div>

    </div>

</body>

</html>
